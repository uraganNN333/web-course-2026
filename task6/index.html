<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Змейка</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Змейка 🐍</h1>
      <p class="subtitle">Ешь яблоки и не врезайся в стены и в себя.</p>
    </header>

    <div class="scoreboard">
      <div class="score">
        <span class="score-label">Счёт</span>
        <span id="score" class="score-value">0</span>
      </div>
      <div class="score">
        <span class="score-label">Рекорд</span>
        <span id="best" class="score-value">0</span>
      </div>
    </div>

    <canvas id="game" class="game" width="400" height="400">Ваш браузер не поддерживает Canvas.</canvas>

    <div class="controls">
      <button id="start" type="button" class="button">Старт</button>
    </div>

    <div class="dpad" aria-label="Кнопки управления">
      <button type="button" class="dpad-button dpad-up" data-direction="up" aria-label="Вверх">▲</button>
      <button type="button" class="dpad-button dpad-left" data-direction="left" aria-label="Влево">◀</button>
      <button type="button" class="dpad-button dpad-down" data-direction="down" aria-label="Вниз">▼</button>
      <button type="button" class="dpad-button dpad-right" data-direction="right" aria-label="Вправо">▶</button>
    </div>
    <p class="hint">Управление: стрелки на клавиатуре (или кнопки выше на телефоне).</p>
  </main>
</body>
</html>
